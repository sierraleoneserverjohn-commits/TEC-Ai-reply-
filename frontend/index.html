<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Johnny TEC AI Reply</title>
  <meta name="description" content="WhatsApp AI Auto-Reply Control Panel">
  
  <!-- PWA & Theme -->
  <meta name="theme-color" content="#0a101d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Johnny TEC">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="icons/logo.svg">

  <!-- Inter / System Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Main Application Container -->
  <div id="app">
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 16px; color: #94a3b8;">
      <div class="spinner"></div>
      <p style="font-size: 13.5px; font-weight: 500;">Starting Johnny TEC AI Reply...</p>
    </div>
  </div>

  <!-- App Bootstrap (ES Modules) -->
  <script type="module" src="js/app.js"></script>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('ServiceWorker registered:', reg.scope))
          .catch(err => console.log('ServiceWorker failed:', err));
      });
    }
  </script>
</body>
</html>
