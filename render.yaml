services:
  - type: web
    name: johnny-tec-ai-reply
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        sync: false
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
        value: gemini-2.5-flash
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: WA_TOKEN
        sync: false
      - key: WA_PHONE_NUMBER_ID
        sync: false
      - key: WA_VERIFY_TOKEN
        sync: false
      - key: WA_APP_SECRET
        sync: false
      - key: WA_API_VERSION
        sync: false
        value: v21.0
      - key: ALLOWED_ORIGIN
        sync: false
        value: "*"
      - key: DRY_RUN
        sync: false
        value: "true"
